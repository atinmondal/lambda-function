name: Deploy Lambda

on:
  push:
    branches:
      - dev
      - uat
      - prod

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  LAMBDA_NAME: test  
  ZIP_FILE: function.zip

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: 
      name: ${{ github.ref_name }} 

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # --- NEW SECTION STARTS HERE ---
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12' # Ensure this matches your Lambda runtime version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pylint
          # If you have a requirements.txt, uncomment the next line so pylint can resolve imports
          # if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Lint with Pylint
        run: |
          # Fails if score is under 8.0/10. Adjust threshold or remove flag as needed.
          pylint lambda_function.py --fail-under=8.0
      # --- NEW SECTION ENDS HERE ---

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_IAM_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Package code
        run: |
          rm -f ${ZIP_FILE}
          # If you have dependencies, you usually install them into a package folder and zip that too.
          # For a simple script, this is fine:
          zip -r ${ZIP_FILE} lambda_function.py

      - name: Update Lambda function code
        run: |
          echo "Deploying to Account using Role: ${{ secrets.AWS_IAM_ROLE }}"
          
          aws lambda update-function-code \
            --function-name "${LAMBDA_NAME}" \
            --zip-file fileb://${ZIP_FILE} \
            --publish

      - name: Quick smoke invoke
        run: |
          echo '{}' > /tmp/event.json
          aws lambda invoke --function-name "${LAMBDA_NAME}" --payload file:///tmp/event.json /tmp/output.json
          cat /tmp/output.json