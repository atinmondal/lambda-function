name: Deploy Lambda

on:
  push:
    branches:
      - dev
      - uat
      - prod

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  LAMBDA_NAME: test  
  ZIP_FILE: function.zip

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: 
      name: ${{ github.ref_name }} 

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Install Pylint + Security Tools
          pip install pylint bandit safety
          # Install your actual lambda dependencies if you have them
          # if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Lint with Pylint
        run: |
          pylint lambda_function.py --fail-under=8.0

      # --- NEW SECURITY SECTION STARTS HERE ---
      
      - name: SAST Scan (Bandit)
        run: |
          # Scans current directory (.) recursively (-r)
          # -ll: reports only Medium and High severity issues
          bandit -r . -ll

      - name: SCA Scan (Safety)
        run: |
          # Checks installed packages for known vulnerabilities
          safety check
          
      # --- NEW SECURITY SECTION ENDS HERE ---

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_IAM_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Package code
        run: |
          rm -f ${ZIP_FILE}
          zip -r ${ZIP_FILE} lambda_function.py

      - name: Update Lambda function code
        run: |
          echo "Deploying to Account using Role: ${{ secrets.AWS_IAM_ROLE }}"
          aws lambda update-function-code \
            --function-name "${LAMBDA_NAME}" \
            --zip-file fileb://${ZIP_FILE} \
            --publish

      - name: Quick smoke invoke
        run: |
          echo '{}' > /tmp/event.json
          aws lambda invoke --function-name "${LAMBDA_NAME}" --payload file:///tmp/event.json /tmp/output.json
          cat /tmp/output.json